<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acoustic Tuner, Metronome & Chords</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=20260518b">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Tuner, Metronome & Chords</h1>
        </header>

        <main>
            <!-- Tuner Section -->
            <section id="tuner" class="card">
                <div class="card-header">
                    <h2>Guitar Tuner</h2>
                    <div class="status-indicator" id="tuner-status" title="Mic Status"></div>
                </div>
                
                <div class="tuner-display">
                    <div class="note-display">
                        <span id="note-name">--</span>
                        <span id="frequency-display">0 Hz</span>
                    </div>
                    
                    <div class="gauge-container">
                        <div class="gauge-center-line"></div>
                        <div class="gauge-needle" id="gauge-needle"></div>
                        <div class="gauge-labels">
                            <span>flat</span>
                            <span>sharp</span>
                        </div>
                    </div>
                </div>

                <div class="controls">
                    <button id="start-tuner-btn" class="btn-primary">Start Tuner</button>
                </div>

                <div class="string-reference">
                    <h3>Standard Tuning</h3>
                    <div class="string-list">
                        <div class="string-item"><span class="string-num">6</span><span class="string-note">E2</span><span class="string-freq">82.41 Hz</span></div>
                        <div class="string-item"><span class="string-num">5</span><span class="string-note">A2</span><span class="string-freq">110.00 Hz</span></div>
                        <div class="string-item"><span class="string-num">4</span><span class="string-note">D3</span><span class="string-freq">146.83 Hz</span></div>
                        <div class="string-item"><span class="string-num">3</span><span class="string-note">G3</span><span class="string-freq">196.00 Hz</span></div>
                        <div class="string-item"><span class="string-num">2</span><span class="string-note">B3</span><span class="string-freq">246.94 Hz</span></div>
                        <div class="string-item"><span class="string-num">1</span><span class="string-note">E4</span><span class="string-freq">329.63 Hz</span></div>
                    </div>
                </div>
            </section>

            <!-- Metronome Section -->
            <section id="metronome" class="card">
                <div class="card-header">
                    <h2>Metronome</h2>
                </div>

                <div class="metronome-display">
                    <div class="bpm-display">
                        <span id="bpm-value">120</span>
                        <span class="bpm-label">BPM</span>
                    </div>
                    
                    <div class="beat-dots" id="beat-dots">
                        <!-- Dots will be generated by JS -->
                        <div class="dot"></div>
                        <div class="dot"></div>
                        <div class="dot"></div>
                        <div class="dot"></div>
                    </div>
                </div>

                <div class="controls">
                    <div class="slider-container">
                        <button class="adjust-btn" id="bpm-decrease">-</button>
                        <input type="range" id="bpm-slider" min="40" max="218" value="120">
                        <button class="adjust-btn" id="bpm-increase">+</button>
                    </div>
                    
                    <button id="start-metronome-btn" class="btn-primary">Start</button>
                </div>
            </section>

            <!-- Chord Library Section -->
            <section id="chords" class="card">
                <div class="card-header">
                    <h2>Chord Library</h2>
                </div>

                <div class="chord-search">
                    <label class="chord-search-label" for="chord-search-input">Search chord</label>
                    <input type="search" id="chord-search-input" placeholder="Try C, F#m, maj7, or 7">
                </div>

                <div class="chord-grid" id="chord-grid">
                    <!-- Chord buttons generated by JS -->
                </div>
                <p class="chord-empty" id="chord-empty" hidden>No matching chords yet.</p>

                <div class="chord-detail" id="chord-detail">
                    <div class="chord-diagram" id="chord-diagram">
                        <!-- SVG fretboard rendered by JS -->
                    </div>
                    <button id="play-chord-btn" class="btn-primary chord-play-btn">Play Chord</button>
                </div>
            </section>

            <!-- Song Chart Section -->
            <section id="song-chart" class="card">
                <div class="card-header">
                    <h2>Song Chart</h2>
                </div>

                <div class="song-import">
                    <label class="file-upload-label" for="song-file-input">
                        <span class="file-upload-icon">♪</span>
                        <span class="file-upload-text">Upload a song chart</span>
                        <span class="file-upload-hint">TXT, ChordPro, or markdown with chords</span>
                    </label>
                    <input type="file" id="song-file-input" accept=".txt,.pro,.chordpro,.cho,.crd,.md,text/plain,text/markdown" hidden>

                    <label class="song-paste-label" for="song-input">Or paste a chart</label>
                    <textarea id="song-input" rows="7" spellcheck="false" placeholder="[Verse]&#10;C              G&#10;Amazing grace, how sweet the sound&#10;Am             F&#10;That saved a soul like me"></textarea>
                </div>

                <div class="song-controls">
                    <label class="control-label" for="source-key-select">Imported key</label>
                    <select id="source-key-select" class="key-select">
                        <option>C</option>
                        <option>Db</option>
                        <option>D</option>
                        <option>Eb</option>
                        <option>E</option>
                        <option>F</option>
                        <option>F#</option>
                        <option>G</option>
                        <option>Ab</option>
                        <option>A</option>
                        <option>Bb</option>
                        <option>B</option>
                    </select>

                    <div class="control-label">Song key</div>
                    <div class="key-button-grid" id="song-key-buttons"></div>

                    <div class="control-label">Capo / Play</div>
                    <div class="capo-button-grid" id="capo-buttons"></div>

                    <button id="play-chart-btn" class="btn-primary">Play Chart</button>
                </div>

                <div class="song-chart-meta" id="song-chart-meta">No chart loaded yet</div>
                <div class="song-chart-output" id="song-chart-output" aria-live="polite"></div>
            </section>
        </main>

        <footer>
            <p>Built with Web Audio API</p>
        </footer>
    </div>
    <script src="app.js?v=20260518b"></script>
</body>
</html>
